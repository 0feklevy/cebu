# Release FlowVid — the deterministic release autopilot.
#
# merge to main → run this workflow → pick bump → receive a full release report.
#
# The pipeline: plan/verify source → full test+build gate → immutable images on GHCR →
# annotated tag + draft release → THE CANDIDATE IMAGES ARE BOOTED AND EXERCISED → digest-pinned
# deploy on the VM (no builds there) → health + browser verification → automatic rollback on any
# CRITICAL failure → published release + release-report.{md,json}.
#
# APPROVAL IS CONDITIONAL, NOT ROUTINE. A release stops for a human only when one exists to be
# made: a destructive or backward-incompatible migration, a backfill policy that can write data,
# an accepted HIGH finding, or a change to auth, secrets, media-token or deployment configuration.
# `release-cli release-risk` decides that in the `plan` job from evidence the pipeline already
# produced, and evidence it cannot read counts as a reason to ask.
#
# The unconditional approval this replaced was answered the same way every time — which is what
# an approval requested for every release always becomes. What now stands in its place is the
# `candidate-smoke` job: the exact digest-pinned images that are about to be deployed are started
# as containers and exercised over HTTP before the deploy job can begin. That gate cannot be
# clicked through, and ops/release's tests fail if any edit lets a deploy past a failed one.
#
# No AI is involved anywhere in this workflow. Secrets are environment-scoped; the
# GHCR pull token travels to the VM via stdin only.
name: Release FlowVid

run-name: 'Release FlowVid — ${{ inputs.bump }} (deploy=${{ inputs.deploy }}) by @${{ github.actor }}'

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'SemVer bump'
        type: choice
        options: [patch, minor, major]
        required: true
      deploy:
        description: 'Deploy to production (after manual approval)?'
        type: boolean
        default: true
      backfill_policy:
        description: 'Data backfill policy (URL repair)'
        type: choice
        options: [report-only, allow-safe, require-approval]
        default: report-only
      approve_high:
        description: 'Explicitly approve HIGH findings (destructive migrations / unsafe backfills)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

env:
  ART: ${{ github.workspace }}/release-artifacts
  RUN_ID: rel-${{ github.run_id }}-${{ github.run_attempt }}

defaults:
  run:
    working-directory: podcast-saas

jobs:
  # ── 1. PLANNED → SOURCE_VERIFIED ────────────────────────────────────────────────
  plan:
    name: Plan & verify source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      next_tag: ${{ steps.plan.outputs.next_tag }}
      current_tag: ${{ steps.plan.outputs.current_tag }}
      git_sha: ${{ steps.plan.outputs.git_sha }}
      requires_human: ${{ steps.risk.outputs.requires_human }}
      # Release-blocking flows that actually have a fixture. Empty means nothing is required,
      # so a flow with nowhere to run cannot trigger a post-deploy rollback.
      require_tests: ${{ steps.fixtures.outputs.require_tests }}
      risk_reasons: ${{ steps.risk.outputs.risk_reasons }}
    steps:
      - name: Releases run only from main
        working-directory: .
        run: |
          [ "${GITHUB_REF}" = "refs/heads/main" ] || { echo "::error::Release must be dispatched on main (got ${GITHUB_REF})."; exit 1; }
      # credentials kept: preflight runs `git ls-remote --tags origin` (remote read).
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: podcast-saas/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: podcast-saas/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --filter ops-release
      - name: Compute next version (immutable tags)
        id: plan
        run: pnpm --filter ops-release release-cli plan --bump "${{ inputs.bump }}" --out "$ART/plan.json"
      - name: Resolve what is ACTUALLY deployed (refs/deployed/production)
        id: deployed
        run: |
          set -euo pipefail
          # The risk window must be measured from the DEPLOYED version, not the last tag. A tag is
          # created BEFORE the human-approval gate runs, so a failed approval leaves a tag that
          # never shipped — and a window measured from it excludes exactly the change the gate
          # demanded a human for, while the deploy ships HEAD's tree, which contains it. Observed
          # live: run 32854681109 (ledger, 2026-08-25).
          #
          # refs/deployed/production is advanced by the deploy job only after the post-deploy gate
          # passes. Not a tag (assertTagAvailable's immutability contract stays intact), not a
          # branch (nothing can check it out by accident or open a PR against it).
          #
          # Every failure path lands on kind=unresolved, which release-risk treats as a
          # mandatory-approval reason — the gate fails toward requiring a person, never away.
          KIND=unresolved
          BASE=""
          DEPLOYED_SHA="$(git ls-remote origin refs/deployed/production | cut -f1 || true)"
          if [ -n "$DEPLOYED_SHA" ] \
             && git cat-file -e "${DEPLOYED_SHA}^{commit}" 2>/dev/null \
             && git merge-base --is-ancestor "$DEPLOYED_SHA" HEAD; then
            KIND=deployed-ref
            BASE="$DEPLOYED_SHA"
            echo "deployed base: $DEPLOYED_SHA"
          else
            echo "::warning::refs/deployed/production is missing, unfetchable, or not an ancestor of HEAD — release-risk will require human approval."
          fi
          echo "kind=$KIND" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
      - name: Initialize release state machine
        run: |
          pnpm --filter ops-release release-cli state-init --file "$ART/state.json" \
            --run-id "$RUN_ID" --version "${{ steps.plan.outputs.next_tag }}" \
            --git-sha "${{ steps.plan.outputs.git_sha }}" --bump "${{ inputs.bump }}"
      - name: Preflight (clean main-only source, free tag, determinism pins)
        run: pnpm --filter ops-release release-cli preflight --next-tag "${{ steps.plan.outputs.next_tag }}" --out "$ART/preflight.json"
      - name: Secret scan
        run: pnpm --filter ops-release release-cli secret-scan --out "$ART/secret-scan.json"
      - name: Migration audit (vs what is DEPLOYED, not vs the last tag)
        # Same trap as the risk window: a migration that landed in a tagged-but-undeployed release
        # is not "new since the last tag" — but it WILL run on this deploy. When the deployed base
        # is unresolved this falls back to the tag (no regression), and release-risk is already
        # forcing a human onto that release.
        run: pnpm --filter ops-release release-cli migration-audit --base-ref "${{ steps.deployed.outputs.kind == 'deployed-ref' && steps.deployed.outputs.base || steps.plan.outputs.current_tag }}" --out "$ART/migration-audit.json"
      - name: Pre-build gate
        run: |
          pnpm --filter ops-release release-cli gate --phase pre-deploy \
            --findings "$ART/preflight.json,$ART/secret-scan.json,$ART/migration-audit.json" \
            ${{ inputs.approve_high && '--approve-high' || '' }} \
            --out "$ART/gate.json"
      - name: Does this release still need a human?
        id: risk
        run: |
          set -euo pipefail
          # The changed-paths window, measured from the resolved DEPLOYED base. When the base is
          # unresolved the file is left deliberately absent: cmdReleaseRisk refuses to combine a
          # 'deployed-ref' claim with a missing file, and an absent file under 'unresolved' adds
          # nothing — the unresolved base is already a mandatory-approval reason. (The previous
          # shape wrote an EMPTY file on a failed diff and a comment here claimed release-risk
          # would fail closed on it; it did not — empty read as "nothing changed".)
          if [ "${{ steps.deployed.outputs.kind }}" = "deployed-ref" ]; then
            git diff --name-only "${{ steps.deployed.outputs.base }}"..HEAD > "$ART/changed-paths.txt"
          fi
          pnpm --filter ops-release release-cli release-risk \
            --findings "$ART/preflight.json,$ART/secret-scan.json,$ART/migration-audit.json" \
            --backfill-policy "${{ inputs.backfill_policy }}" \
            ${{ inputs.approve_high && '--approve-high' || '' }} \
            --changed-paths "$ART/changed-paths.txt" \
            --diff-base "${{ steps.deployed.outputs.kind }}" \
            --out "$ART/release-risk.json"
      - name: Are the release-blocking flows configured to run at all?
        id: fixtures
        # WARNS, DOES NOT BLOCK — and the first version of this blocked, which was wrong.
        #
        # The problem it solves is real: `--require-tests` makes a SKIPPED release-blocking flow
        # CRITICAL, and the post-deploy gate turns CRITICAL into an automatic rollback. Every one
        # of those flows is `test.skip(!process.env.SMOKE_PUBLIC_PATH, …)`, and those variables are
        # unset — so without something here, the first release would have rolled back a perfectly
        # healthy deploy over a missing configuration value.
        #
        # But refusing to release is the wrong half of that trade. It blocks security fixes on a
        # configuration task, and the person who can do the configuring is not always there. A
        # deploy that proceeds with a LOUD, recorded gap is not the silent green this replaced.
        #
        # So the requirement is passed downstream only for flows that HAVE a fixture. A flow with
        # nowhere to run is reported here and excluded from the post-deploy requirement; a flow
        # that HAS somewhere to run and still did not run stays CRITICAL, and the rollback then
        # means what it says.
        run: |
          set -euo pipefail
          missing=""
          [ -n "${{ vars.SMOKE_PUBLIC_PATH }}" ]        || missing="$missing SMOKE_PUBLIC_PATH"
          [ -n "${{ vars.SMOKE_PLAYLIST_PATH }}" ]      || missing="$missing SMOKE_PLAYLIST_PATH"
          [ -n "${{ vars.SMOKE_ADMIN_PREVIEW_PATH }}" ] || missing="$missing SMOKE_ADMIN_PREVIEW_PATH"

          if [ -n "$missing" ]; then
            echo "::warning::Release-blocking production flows have NO FIXTURE and will not run:$missing"
            echo "::warning::Set them as repository variables (Settings → Secrets and variables →"
            echo "::warning::Actions → Variables). Until then this release deploys WITHOUT verifying"
            echo "::warning::project pages, playlists or admin preview in production."
            {
              echo '### ⚠️ Production flows not verified'
              echo ''
              echo 'These repository variables are unset, so the flows that depend on them were'
              echo 'skipped rather than run:'
              echo ''
              for v in $missing; do echo "- \`$v\`"; done
              echo ''
              echo 'The deploy proceeded. It was NOT verified against those surfaces.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          # Named flows go downstream ONLY when they have somewhere to run. An empty value means
          # `--require-tests` is not passed at all, so nothing is required and nothing rolls back.
          if [ -z "${{ vars.SMOKE_PUBLIC_PATH }}" ]; then
            echo "require_tests=" >> "$GITHUB_OUTPUT"
          else
            echo "require_tests=opening an existing project renders its media,a stored media URL is minted and the resource actually loads,an untokenised private media URL is refused,playback starts on a real project,the export entry point is reachable" >> "$GITHUB_OUTPUT"
          fi
      - name: Prove the approval environment is actually protected
        # ONLY MEANINGFUL FOR RISKY RELEASES, AND ESSENTIAL FOR THEM.
        #
        # `environment: production-approval` does not fail when that environment has no rules —
        # GitHub creates it on first use with none, and the job simply runs. The approval gate
        # would then be a job that prints a warning and continues, which is indistinguishable in
        # every log from one that a person actually approved. So the protection is verified
        # rather than assumed, and anything that prevents verifying it — a 403, a rename, a rule
        # removed — blocks the release instead of quietly downgrading it to automatic.
        if: ${{ steps.risk.outputs.requires_human == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rules=$(gh api "repos/${{ github.repository }}/environments/production-approval" \
                    --jq '[.protection_rules[].type] | join(",")' 2>/dev/null) || {
            echo "::error::Could not read the production-approval environment. A risky release must not"
            echo "::error::deploy on the assumption that an approval gate exists. Grant the workflow token"
            echo "::error::read access to environments, or approve this release manually."
            exit 1
          }
          echo "production-approval rules: $rules"
          case "$rules" in
            *required_reviewers*) echo "approval gate is armed" ;;
            *) echo "::error::production-approval has NO required reviewers ($rules). This release was"
               echo "::error::classified as risky, so it must not proceed through an unprotected environment."
               exit 1 ;;
          esac
      - name: State → SOURCE_VERIFIED
        run: pnpm --filter ops-release release-cli state-transition --file "$ART/state.json" --to SOURCE_VERIFIED
      - uses: actions/upload-artifact@v6
        with: { name: release-artifacts, path: release-artifacts, overwrite: true, include-hidden-files: true }

  # ── 2. SOURCE_VERIFIED → TESTED ────────────────────────────────────────────────
  verify:
    name: Full release verification (tests + prod builds + bundle scan)
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.git_sha }}
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: podcast-saas/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: podcast-saas/pnpm-lock.yaml
      - uses: actions/download-artifact@v6
        with: { name: release-artifacts, path: release-artifacts }
      - name: release:verify (frozen install → typecheck → lint → tests → prod builds → bundle scan)
        run: |
          # `set -o pipefail` is LOAD-BEARING, not tidiness. Without it this step's exit status is
          # `tee`'s — always 0 — and a failing release:verify is swallowed whole. That is not
          # hypothetical: v0.2.5 printed "backend-api lint: ✖ 8 problems (1 error, ...)" followed
          # by "Failed", this step reported success, the gate passed, and it deployed to
          # production. CLAUDE.md §4 calls release:verify "the real gate"; for one lint error it
          # was not a gate at all. Every other piped step in this file already sets this.
          set -euo pipefail
          pnpm release:verify 2>&1 | tee "$ART/release-verify.log"
      - name: Record test counts (best effort)
        run: |
          {
            echo '['
            grep -hoE 'Tests[[:space:]]+[0-9]+ passed' "$ART/release-verify.log" \
              | awk '{n+=$2} END { printf "{\"suite\":\"vitest (all workspaces)\",\"total\":%d,\"passed\":%d,\"failed\":0}", n, n }'
            echo ']'
          } > "$ART/tests.json" || echo '[]' > "$ART/tests.json"
      - name: State → TESTED
        run: pnpm --filter ops-release release-cli state-transition --file "$ART/state.json" --to TESTED
      - uses: actions/upload-artifact@v6
        with: { name: release-artifacts, path: release-artifacts, overwrite: true, include-hidden-files: true }

  # ── 3. TESTED → IMAGES_BUILT/IMAGES_PUBLISHED (GitHub-hosted builders, never the VM) ──
  build-images:
    name: Build & push ${{ matrix.service }}
    needs: [plan, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        service: [backend, client-web, admin-web]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.git_sha }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push backend image
        if: matrix.service == 'backend'
        id: build_backend
        uses: docker/build-push-action@v7
        with:
          context: podcast-saas
          file: podcast-saas/deploy/docker/backend.Dockerfile
          push: true
          provenance: false
          tags: |
            ghcr.io/0feklevy/cebu/backend:${{ needs.plan.outputs.next_tag }}
            ghcr.io/0feklevy/cebu/backend:sha-${{ needs.plan.outputs.git_sha }}
          build-args: |
            NODE_BUILD_MEMORY=6144
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build & push ${{ matrix.service }} image
        if: matrix.service != 'backend'
        id: build_web
        uses: docker/build-push-action@v7
        with:
          context: podcast-saas
          file: podcast-saas/deploy/docker/web.Dockerfile
          push: true
          provenance: false
          tags: |
            ghcr.io/0feklevy/cebu/${{ matrix.service }}:${{ needs.plan.outputs.next_tag }}
            ghcr.io/0feklevy/cebu/${{ matrix.service }}:sha-${{ needs.plan.outputs.git_sha }}
          build-args: |
            APP=${{ matrix.service }}
            NODE_BUILD_MEMORY=6144
            NEXT_PUBLIC_API_URL=https://api.flowvidco.com
            NEXT_PUBLIC_APP_URL=https://flowvidco.com
            PUBLIC_SITE_URL=${{ matrix.service == 'admin-web' && 'https://admin.flowvidco.com' || 'https://flowvidco.com' }}
            NEXT_PUBLIC_FIREBASE_API_KEY=${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
            NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
            NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ vars.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
            NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ vars.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
            NEXT_PUBLIC_FIREBASE_APP_ID=${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}
            PUBLIC_BRAND_NAME=${{ vars.PUBLIC_BRAND_NAME }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Record immutable digest
        working-directory: .
        run: |
          DIGEST='${{ steps.build_backend.outputs.digest || steps.build_web.outputs.digest }}'
          [ -n "$DIGEST" ] || { echo '::error::no image digest returned'; exit 1; }
          mkdir -p digests
          printf '{"service":"%s","repository":"ghcr.io/0feklevy/cebu/%s","tag":"%s","digest":"%s"}\n' \
            '${{ matrix.service }}' '${{ matrix.service }}' '${{ needs.plan.outputs.next_tag }}' "$DIGEST" \
            > "digests/${{ matrix.service }}.json"
      - uses: actions/upload-artifact@v6
        with: { name: 'digest-${{ matrix.service }}', path: digests/ }

  # ── 4. → MIGRATIONS_PLANNED (+ tag + draft release + reviewable plan) ───────────
  release-plan:
    name: Manifest, tag & draft release
    needs: [plan, verify, build-images]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # annotated tag + draft release ONLY in this job
    steps:
      # credentials kept: this job pushes the annotated release tag.
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.git_sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: podcast-saas/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: podcast-saas/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --filter ops-release
      - uses: actions/download-artifact@v6
        with: { name: release-artifacts, path: release-artifacts }
      - uses: actions/download-artifact@v6
        with: { pattern: digest-*, path: digests, merge-multiple: true }
      - name: Assemble immutable image manifest
        working-directory: .
        run: |
          jq -s '{schema:"flowvid.image-manifest/v1",
                  version:"${{ needs.plan.outputs.next_tag }}",
                  gitSha:"${{ needs.plan.outputs.git_sha }}",
                  images:.}' digests/*.json > "$ART/manifest.json"
          cat "$ART/manifest.json"
      - name: Verify manifest (digests, namespace, no floating tags)
        run: pnpm --filter ops-release release-cli image-manifest --verify --manifest "$ART/manifest.json" --out "$ART/image-manifest.json"
      - name: State → IMAGES_BUILT → IMAGES_PUBLISHED → MIGRATIONS_PLANNED
        run: |
          pnpm --filter ops-release release-cli state-transition --file "$ART/state.json" --to IMAGES_BUILT
          pnpm --filter ops-release release-cli state-transition --file "$ART/state.json" --to IMAGES_PUBLISHED
          pnpm --filter ops-release release-cli state-transition --file "$ART/state.json" --to MIGRATIONS_PLANNED
      - name: Create annotated tag (never moved, never reused)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a '${{ needs.plan.outputs.next_tag }}' '${{ needs.plan.outputs.git_sha }}' \
            -m 'FlowVid ${{ needs.plan.outputs.next_tag }} (run ${{ env.RUN_ID }})'
          git push origin 'refs/tags/${{ needs.plan.outputs.next_tag }}'
      - name: Release plan → job summary + draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '## Release plan — ${{ needs.plan.outputs.next_tag }}'
            echo ''
            echo '| Field | Value |'
            echo '| --- | --- |'
            echo '| Version | ${{ needs.plan.outputs.next_tag }} (was ${{ needs.plan.outputs.current_tag }}) |'
            echo '| Commit | ${{ needs.plan.outputs.git_sha }} |'
            echo '| Deploy | ${{ inputs.deploy }} |'
            echo '| Backfill policy | ${{ inputs.backfill_policy }} |'
            echo ''
            echo '### Immutable images'
            echo ''
            echo '| Service | Digest |'
            echo '| --- | --- |'
            jq -r '.images[] | "| \(.service) | `\(.digest)` |"' "$ART/manifest.json"
            echo ''
            echo '### Migration plan'
            echo ''
            echo '```json'
            jq '.summary, (.newMigrations | map({name, checksum, statements, transactional, tables}))' "$ART/migration-audit.json"
            echo '```'
            echo ''
            echo '_Approve the **production** environment on the deploy job to proceed._'
          } > plan-summary.md
          cat plan-summary.md >> "$GITHUB_STEP_SUMMARY"
          gh release create '${{ needs.plan.outputs.next_tag }}' --draft --verify-tag \
            --title 'FlowVid ${{ needs.plan.outputs.next_tag }}' --notes-file plan-summary.md
      - name: State → AWAITING_APPROVAL
        if: ${{ inputs.deploy }}
        run: pnpm --filter ops-release release-cli state-transition --file "$ART/state.json" --to AWAITING_APPROVAL
      - uses: actions/upload-artifact@v6
        with: { name: release-artifacts, path: release-artifacts, overwrite: true, include-hidden-files: true }

  # ── 5. AWAITING_APPROVAL → … → BROWSER_VERIFIED (protected environment) ─────────
  # ── The candidate images, actually run ──────────────────────────────────────────────────────
  #
  # THIS IS THE GATE THAT REPLACES A HUMAN CLICKING "APPROVE". Every check before it tests the
  # SOURCE: `verify` runs the workspace's tests and production builds. Nothing had ever started
  # the images that are about to be deployed — the one artifact production actually runs.
  #
  # It boots the candidate by DIGEST (from image-manifest.json, the same pinning the deploy uses)
  # against a real Postgres, and exercises the seams that only exist once the pieces are separate
  # processes in separate images: does it boot, do migrations apply to a real engine, can the two
  # images reach each other, and does a stored key become a URL a browser can actually FETCH.
  #
  # FAIL CLOSED, three ways over:
  #   1. compose refuses to start without digest-pinned image references (`${VAR:?message}`);
  #   2. every step is a hard failure — no continue-on-error anywhere in this job, unlike the
  #      post-deploy collectors, because there is nothing to roll back from yet and the correct
  #      answer to "we could not tell" is "do not deploy";
  #   3. the gate REQUIRES this suite's summary and requires it to carry THIS run and commit, so a
  #      suite that never ran cannot be scored as a clean pass (the v0.1.5 shape of failure).
  candidate-smoke:
    name: Candidate image smoke (the images that will deploy)
    needs: [plan, release-plan]
    if: ${{ inputs.deploy }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.git_sha }}
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: podcast-saas/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: podcast-saas/pnpm-lock.yaml
      - name: Install workspace (frozen)
        run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v6
        with: { name: release-artifacts, path: release-artifacts }
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve the digest-pinned candidate images
        id: images
        run: |
          set -euo pipefail
          # THE SAME FILE `remote-deploy` PINS FROM. Reading a different artifact here would let the
          # gate bless one set of digests while production pulled another — the exact class of hole
          # this job exists to close. `release-plan` has already run `image-manifest --verify` over
          # it (namespace, sha256 form, no floating tag) and fails its own job on a CRITICAL, so a
          # manifest that reaches this step is a verified one.
          # ABSOLUTE, via $ART. This job's `run:` steps inherit `working-directory: podcast-saas`
          # from the workflow defaults, while `download-artifact` writes relative to the WORKSPACE
          # root — so a relative `artifacts/manifest.json` here looked in `podcast-saas/artifacts/`
          # and found nothing. The gate failed closed and blocked the deploy, which is the system
          # working; it also cost a full build to discover, which a test now prevents.
          MANIFEST="$ART/manifest.json"
          # No manifest ⇒ no candidate ⇒ no deploy. Never fall back to a floating tag: a `:latest`
          # here would test something merely NAMED like the candidate.
          test -f "$MANIFEST" || { echo "::error::manifest.json is missing — cannot identify the candidate"; exit 1; }
          test "$(jq -r '.schema' "$MANIFEST")" = 'flowvid.image-manifest/v1' \
            || { echo "::error::manifest.json is not a flowvid.image-manifest/v1 document"; exit 1; }
          be=$(jq -er '.images[] | select(.service=="backend") | "\(.repository)@\(.digest)"' "$MANIFEST")
          cw=$(jq -er '.images[] | select(.service=="client-web") | "\(.repository)@\(.digest)"' "$MANIFEST")
          # Belt and braces: refuse anything that is not digest-pinned, whatever the manifest claims.
          for ref in "$be" "$cw"; do
            case "$ref" in
              *@sha256:*) ;;
              *) echo "::error::candidate reference is not digest-pinned: $ref"; exit 1 ;;
            esac
          done
          echo "backend=$be" >> "$GITHUB_OUTPUT"
          echo "client_web=$cw" >> "$GITHUB_OUTPUT"
          # Also to $GITHUB_ENV: every LATER step in this job runs `docker compose` against the
          # candidate file, whose services interpolate ${BACKEND_IMAGE}/${CLIENT_WEB_IMAGE} as
          # REQUIRED variables. The per-step `env:` block existed only on "Start the candidate
          # stack", so the very next step — applying migrations — died on
          # "required variable BACKEND_IMAGE is missing a value" (run 32640689308, v0.1.42),
          # skipping the deploy. Job-level env from a step output is not expressible in GitHub
          # Actions; the environment file is the supported way to make a step's discovery stick.
          echo "BACKEND_IMAGE=$be" >> "$GITHUB_ENV"
          echo "CLIENT_WEB_IMAGE=$cw" >> "$GITHUB_ENV"
          echo "candidate backend:    $be"
          echo "candidate client-web: $cw"
      - name: Mint a throwaway Firebase credential for the candidate
        run: |
          set -euo pipefail
          # `getFirebaseAdmin()` runs during the backend's startup and throws when the three
          # FIREBASE_* variables are missing, and `admin.credential.cert()` PARSES the PEM — so
          # the candidate needs a syntactically real key, and a placeholder string will not do.
          #
          # Generated here rather than committed or taken from a secret. It authenticates nothing
          # and exists for the lifetime of one job. Using the real production credential would put
          # a live key in a throwaway stack for no gain; committing a fake one would put key
          # material in the repository and teach the next reader that it belongs there.
          key=$(openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 2>/dev/null)
          # Masked LINE BY LINE, which is the only thing that works.
          #
          # `::add-mask::` registers one exact string, and the runner replaces that string when it
          # appears contiguously. A PEM is multi-line, and when the runner echoes a step's `env:`
          # block it prints the value across lines — so the blob-level mask matched nothing and the
          # whole key appeared in the log of the failing run, under a comment claiming it could not.
          # Registering each line means each line is replaced wherever it shows up.
          #
          # The key is generated here and authenticates nothing, so this exposed no secret. It is
          # fixed because the pattern is the problem: the same code with a real credential in it
          # would have leaked one, and the comment would still have said it was safe.
          while IFS= read -r line; do
            [ -n "$line" ] && echo "::add-mask::$line"
          done <<< "$key"
          {
            echo 'CANDIDATE_FIREBASE_CREDENTIAL<<PEM_EOF'
            echo "$key"
            echo 'PEM_EOF'
          } >> "$GITHUB_ENV"
      - name: Start the candidate stack
        env:
          BACKEND_IMAGE: ${{ steps.images.outputs.backend }}
          CLIENT_WEB_IMAGE: ${{ steps.images.outputs.client_web }}
        run: |
          set -euo pipefail
          # `cd deploy`, NOT `cd podcast-saas/deploy`. This job's `run:` steps inherit
          # `defaults.run.working-directory: podcast-saas`, so the repo-root spelling resolves to
          # `podcast-saas/podcast-saas/deploy` and every one of these steps died on `cd`. Same
          # class as the `artifacts/manifest.json` path fixed in #81 — a path written as if from
          # the repo root inside a job that does not start there.
          cd deploy
          docker compose -f docker-compose.candidate.yml up -d --wait --wait-timeout 240
      - name: Apply this build's migrations to a REAL Postgres
        run: |
          set -euo pipefail
          # THE COMMAND PRODUCTION RUNS, VERBATIM. deploy-images.sh line 148 and deploy.sh line 157
          # both run exactly `compose run --rm --no-deps backend node dist/db/migrate.js`; a
          # different invocation here would test a path the VM never takes.
          #
          # This is the single highest-value check in the job. The backend suite runs on PGlite,
          # which serialises a `Date` where real Postgres rejects it — a divergence that left the
          # whole dubbing feature dead in production while every test stayed green (D-23). It also
          # catches a `.sql` file missing from migrate.ts's hardcoded list, which applies silently
          # to nothing and is invisible until the first query against the missing column.
          #
          # No `|| true`: a migration that cannot apply to an empty, real Postgres is a release
          # that must not reach one with data in it.
          # `cd deploy`, NOT `cd podcast-saas/deploy`. This job's `run:` steps inherit
          # `defaults.run.working-directory: podcast-saas`, so the repo-root spelling resolves to
          # `podcast-saas/podcast-saas/deploy` and every one of these steps died on `cd`. Same
          # class as the `artifacts/manifest.json` path fixed in #81 — a path written as if from
          # the repo root inside a job that does not start there.
          cd deploy
          docker compose -f docker-compose.candidate.yml run --rm --no-deps backend node dist/db/migrate.js
      - name: Seed the storage fixtures the round-trip test asserts on
        id: fixtures
        run: |
          set -euo pipefail
          # The storage tests must exercise REAL objects through the REAL adapter. Without these
          # the spec has an empty candidate to assert about, and an empty assertion loop reports
          # PASS — the vacuous-green failure this whole job exists to prevent. The spec refuses to
          # run at all unless CANDIDATE_STORAGE_FIXTURES is set, so failing to seed blocks deploy.
          #
          # Written into MinIO, not onto the container's disk: the backend reads them back through
          # SupabaseStorageAdapter — the same adapter production writes through — so this covers
          # adapter → object → HTTP rather than a local-disk route production never takes.
          # `cd deploy`, NOT `cd podcast-saas/deploy`. This job's `run:` steps inherit
          # `defaults.run.working-directory: podcast-saas`, so the repo-root spelling resolves to
          # `podcast-saas/podcast-saas/deploy` and every one of these steps died on `cd`. Same
          # class as the `artifacts/manifest.json` path fixed in #81 — a path written as if from
          # the repo root inside a job that does not start there.
          cd deploy
          docker compose -f docker-compose.candidate.yml run --rm --entrypoint /bin/sh minio-init -eu -c '
            mc alias set candidate http://minio:9000 candidateaccesskey candidatesecretkey
            printf "{\"candidate\":true}" > /tmp/asset.json
            printf "<!DOCTYPE html><title>candidate</title><body>candidate-marker</body>" > /tmp/index.html
            mc cp /tmp/asset.json candidate/media/simulations/candidate-smoke/asset.json
            mc cp /tmp/index.html candidate/media/simulations/candidate-smoke/index.html
          '
          # TWO fixtures, because the route treats them differently and only one of them can be
          # compared byte for byte. `injectSimBootSnippet` runs at SERVE time on entry HTML, so the
          # served document is deliberately NOT the stored one — asserting equality there would
          # fail against a correct image. The .json takes the exact-bytes assertion; the .html
          # takes the Content-Type one, which is the check that route exists for.
          cat > /tmp/fixtures.json <<'JSON'
          [{"key":"simulations/candidate-smoke/asset.json",
            "body":"{\"candidate\":true}",
            "match":"exact",
            "contentType":"application/json"},
           {"key":"simulations/candidate-smoke/index.html",
            "body":"candidate-marker",
            "match":"contains",
            "contentType":"text/html"}]
          JSON
          # jq -c, not `tr -d`: stripping whitespace by hand also strips it from inside string
          # values, and these fixture bodies contain both spaces and quotes.
          echo "json=$(jq -c . < /tmp/fixtures.json)" >> "$GITHUB_OUTPUT"
      - name: Install Playwright chromium
        run: pnpm --filter client-web exec playwright install --with-deps chromium
      - name: Candidate smoke (browser, against the containers)
        working-directory: podcast-saas/client-web
        env:
          CANDIDATE_API_URL: http://localhost:8080
          CANDIDATE_APP_URL: http://localhost:3000
          CANDIDATE_STORAGE_FIXTURES: ${{ steps.fixtures.outputs.json }}
        run: npx playwright test --config=playwright.candidate.config.ts
      - name: Summarize + gate (fail closed on missing or stale evidence)
        if: always()
        run: |
          set -euo pipefail
          pnpm --filter ops-release release-cli playwright-summary \
            --report "${{ github.workspace }}/podcast-saas/client-web/e2e-results/candidate-smoke.json" \
            --run-id "$RUN_ID" --git-sha "${{ needs.plan.outputs.git_sha }}" \
            --out "$ART/candidate-smoke.json"
          pnpm --filter ops-release release-cli gate --phase pre-deploy \
            --findings "$ART/candidate-smoke.json" \
            --require "$ART/candidate-smoke.json" \
            --identity-bearing candidate-smoke.json \
            --expect-run-id "$RUN_ID" --expect-git-sha "${{ needs.plan.outputs.git_sha }}" \
            --out "$ART/candidate-gate.json"
      - name: Container logs on failure (the candidate speaks for itself)
        if: failure()
        run: |
          # `cd deploy`, NOT `cd podcast-saas/deploy`. This job's `run:` steps inherit
          # `defaults.run.working-directory: podcast-saas`, so the repo-root spelling resolves to
          # `podcast-saas/podcast-saas/deploy` and every one of these steps died on `cd`. Same
          # class as the `artifacts/manifest.json` path fixed in #81 — a path written as if from
          # the repo root inside a job that does not start there.
          cd deploy
          docker compose -f docker-compose.candidate.yml logs --no-color --tail 200 || true
      - name: Tear the stack down
        if: always()
        run: |
          # `cd deploy`, NOT `cd podcast-saas/deploy`. This job's `run:` steps inherit
          # `defaults.run.working-directory: podcast-saas`, so the repo-root spelling resolves to
          # `podcast-saas/podcast-saas/deploy` and every one of these steps died on `cd`. Same
          # class as the `artifacts/manifest.json` path fixed in #81 — a path written as if from
          # the repo root inside a job that does not start there.
          cd deploy
          docker compose -f docker-compose.candidate.yml down -v || true
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: candidate-smoke-evidence
          path: |
            release-artifacts/candidate-smoke.json
            release-artifacts/candidate-gate.json
            podcast-saas/client-web/e2e-results/candidate-smoke.json
          if-no-files-found: warn

  # ── 5b. RISKY RELEASES ONLY: a human, asked a question worth asking ─────────────
  #
  # This job carries the required reviewer. It is SKIPPED for routine releases, which is the
  # entire point: the owner's own account of the old unconditional approval was that they clicked
  # it "without performing an additional review, so it is not providing meaningful protection."
  # An approval that is requested for every release is answered reflexively for every release;
  # one that appears only when a destructive migration, a data backfill, an accepted HIGH finding
  # or a change to auth/secrets/deploy config is in the diff is a question with content.
  #
  # The verdict is computed in `plan` from evidence the pipeline already produced — the migration
  # audit, backfill_policy and approve_high — and unreadable evidence resolves to "ask a human".
  risk-review:
    name: Human approval (risky release only)
    needs: [plan, release-plan, candidate-smoke]
    if: ${{ inputs.deploy && needs.plan.outputs.requires_human == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 4320
    environment:
      name: production-approval
    steps:
      - name: Why this release stopped for you
        # `working-directory: .` — this job does NOT check out the repository (it exists only to
        # hold the deployment-environment gate), so the workflow-level default of `podcast-saas`
        # names a directory that does not exist on the runner. Every step here died with
        # "An error occurred trying to start process '/usr/bin/bash' … No such file or directory"
        # BEFORE the environment could request a review, so the job failed, `deploy` was skipped as
        # a dependency, and no approval was ever offered to anybody.
        #
        # Observed on v0.2.4 (run 32850636945) and again on 2026-08-26 (run 32939272042): the gate
        # correctly decided a human was needed, said so in its logs, and then crashed on the way to
        # asking. A gate that cannot ask is indistinguishable from a rejected release, which is how
        # this read for two days.
        working-directory: .
        run: |
          echo "::warning::This release requires human approval."
          echo "### Why this release needs a person" >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "${{ needs.plan.outputs.risk_reasons }}" | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'The candidate images have already been booted and exercised; this is not asking you to re-run those checks.' >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to production (digest-pinned)
    # `candidate-smoke` is a HARD dependency, not advisory: the images are exercised before they
    # are deployed, and a candidate that could not be verified blocks the deploy rather than
    # deferring the question to a human who would click through it anyway.
    needs: [plan, release-plan, candidate-smoke, risk-review]
    # `risk-review` is SKIPPED for routine releases, and GitHub skips a dependant whose `needs`
    # was skipped — so tolerating that skip requires switching off the implicit "all needs
    # succeeded" precondition. The dangerous way to do that is a bare `always()`, which also
    # re-admits a FAILED candidate-smoke and silently un-gates the whole pipeline. So the
    # requirement is spelled out instead: candidate-smoke must have SUCCEEDED, and risk-review
    # must be success-or-skipped. `gateIsEnforced` in ops/release refuses any weaker spelling.
    if: >-
      ${{ inputs.deploy
          && !cancelled()
          && needs.candidate-smoke.result == 'success'
          && (needs.risk-review.result == 'success' || needs.risk-review.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: production
      url: https://flowvidco.com
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions:
      # write, for exactly one push: advancing refs/deployed/production after the post-deploy
      # gate passes. Not a tag and not a branch — assertTagAvailable's immutability contract and
      # branch protection are both untouched. The tag job already holds the same permission.
      contents: write
    env:
      SSH_KEY_FILE: ${{ github.workspace }}/.ssh-deploy-key
      KNOWN_HOSTS_FILE: ${{ github.workspace }}/.ssh-known-hosts
      REMOTE: >-
        --host ${{ vars.PRODUCTION_SSH_HOST }} --user ${{ vars.PRODUCTION_SSH_USER }}
        --key ${{ github.workspace }}/.ssh-deploy-key --known-hosts ${{ github.workspace }}/.ssh-known-hosts
        --repo-dir ${{ vars.PRODUCTION_REPO_DIR }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.git_sha }}
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: podcast-saas/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: podcast-saas/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --filter ops-release --filter client-web
      - uses: actions/download-artifact@v6
        with: { name: release-artifacts, path: release-artifacts }
      - name: Write SSH credentials (0600, never logged)
        working-directory: .
        run: |
          umask 077
          printf '%s\n' "${{ secrets.PRODUCTION_SSH_KEY }}" > "$SSH_KEY_FILE"
          printf '%s\n' "${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}" > "$KNOWN_HOSTS_FILE"
      - name: State → DEPLOYING
        run: pnpm --filter ops-release release-cli state-transition --file "$ART/state.json" --to DEPLOYING
      - name: Pin VM checkout to the release commit (git-only; never touches containers)
        id: remote_sync
        continue-on-error: true
        run: pnpm --filter ops-release release-cli remote-sync $REMOTE --git-sha "${{ needs.plan.outputs.git_sha }}"
      - name: Fail fast if the VM checkout could not be pinned (containers left untouched)
        # remote-sync only fetches + checks out git; it never runs docker/compose. If it
        # fails we STOP before remote-deploy, so the running containers stay on the previous
        # version, and we mark the release FAILED so it never appears stuck in DEPLOYING.
        if: steps.remote_sync.outcome != 'success'
        run: |
          pnpm --filter ops-release release-cli state-transition --file "$ART/state.json" --to FAILED \
            --note "remote-sync failed before any container change — production left on the previous version"
          echo "::error::remote-sync FAILED — the running production containers were NOT modified (no image was pulled, retagged, migrated, or recreated). See the stage markers above for the exact point of failure."
          exit 1
      - name: Deploy exact digests (pull → verify → retag → migrate → recreate → health-gate)
        id: remote_deploy
        if: steps.remote_sync.outcome == 'success'
        continue-on-error: true
        env:
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: pnpm --filter ops-release release-cli remote-deploy $REMOTE --manifest "$ART/manifest.json" --ghcr-user "${{ github.repository_owner }}"
      - name: Handle deploy failure (VM auto-rolled-back)
        if: steps.remote_deploy.outcome == 'failure'
        run: |
          pnpm --filter ops-release release-cli state-transition --file "$ART/state.json" --to FAILED --note "deploy-images failed; VM auto-rollback engaged"
          if pnpm --filter ops-release release-cli remote-health $REMOTE; then
            pnpm --filter ops-release release-cli state-transition --file "$ART/state.json" --to ROLLED_BACK --note "previous version healthy"
            echo '{"attempted":true,"target":"(previous version)","success":true}' > "$ART/rollback.json"
          else
            echo '{"attempted":true,"target":"(previous version)","success":false}' > "$ART/rollback.json"
            echo '::error::Deployment failed AND the rollback is not healthy — manual intervention required.'
          fi
      - name: State → MIGRATED → SERVICES_RECREATED → HEALTHY
        if: steps.remote_deploy.outcome == 'success'
        run: |
          pnpm --filter ops-release release-cli state-transition --file "$ART/state.json" --to MIGRATED
          pnpm --filter ops-release release-cli state-transition --file "$ART/state.json" --to SERVICES_RECREATED
          pnpm --filter ops-release release-cli state-transition --file "$ART/state.json" --to HEALTHY
      - name: Data backfill (per policy — report first, apply only when allowed)
        if: steps.remote_deploy.outcome == 'success' && inputs.backfill_policy != 'report-only'
        continue-on-error: true
        run: |
          set -o pipefail
          if [ '${{ inputs.backfill_policy }}' = 'require-approval' ] && [ '${{ inputs.approve_high }}' = 'true' ]; then
            pnpm --filter ops-release release-cli remote-backfill $REMOTE --mode apply --approve-unsafe --out "$ART/backfill-run.json"
          else
            # allow-safe: the VM-side script self-blocks (exit 2) on any unsafe plan.
            pnpm --filter ops-release release-cli remote-backfill $REMOTE --mode apply --out "$ART/backfill-run.json"
          fi
      - name: VM audit (read-only)
        if: steps.remote_deploy.outcome == 'success'
        continue-on-error: true
        run: |
          pnpm --filter ops-release release-cli remote-audit $REMOTE --out "$ART/vm-audit.json"
          pnpm --filter ops-release release-cli vm-audit --file "$ART/vm-audit.json" --policy '${{ inputs.backfill_policy }}' --out "$ART/vm-findings.json"
      - name: Endpoint + live CSP audits
        if: steps.remote_deploy.outcome == 'success'
        continue-on-error: true
        run: |
          pnpm --filter ops-release release-cli endpoint-audit --run-id "$RUN_ID" --git-sha "${{ github.sha }}" --out "$ART/endpoints.json"
          pnpm --filter ops-release release-cli csp-audit --app client-web --out "$ART/csp-client-web.json"
          pnpm --filter ops-release release-cli csp-audit --app admin-web --out "$ART/csp-admin-web.json"
      - name: Browser verification (Playwright against production)
        if: steps.remote_deploy.outcome == 'success'
        continue-on-error: true
        working-directory: podcast-saas/client-web
        env:
          SMOKE_BASE_URL: https://flowvidco.com
          SMOKE_PUBLIC_PATH: ${{ vars.SMOKE_PUBLIC_PATH }}
          SMOKE_PLAYLIST_PATH: ${{ vars.SMOKE_PLAYLIST_PATH }}
          SMOKE_ADMIN_URL: https://admin.flowvidco.com
          SMOKE_ADMIN_EMAIL: ${{ secrets.SMOKE_ADMIN_EMAIL }}
          SMOKE_ADMIN_PASSWORD: ${{ secrets.SMOKE_ADMIN_PASSWORD }}
          SMOKE_ADMIN_PREVIEW_PATH: ${{ vars.SMOKE_ADMIN_PREVIEW_PATH }}
          PLAYWRIGHT_AUDIT_OUT: ${{ env.ART }}/browser-audit.json
        run: |
          npx playwright install --with-deps chromium
          # Production config only. The DEFAULT config collects all 11 e2e specs across three
          # engines (363 tests); nine of those are local suites that import backend-api and
          # shared/sim source, which this job does not install or build — Playwright then dies
          # during collection before any browser opens. It also declares firefox+webkit while
          # only chromium is installed here.
          npx playwright test --config=playwright.production.config.ts
      - name: Summarize browser results
        if: steps.remote_deploy.outcome == 'success'
        continue-on-error: true
        run: |
          # ABSOLUTE path. `pnpm --filter ops-release` sets cwd = ops/release, so the old
          # repo-relative spelling resolved to ops/release/client-web/… → ENOENT. Combined
          # with the gate's "skip files that do not exist", a browser suite that never ran
          # was scored as a clean pass — the v0.1.5 shape of failure.
          pnpm --filter ops-release release-cli playwright-summary \
            --report "${{ github.workspace }}/podcast-saas/client-web/e2e-results/results.json" \
            --run-id "$RUN_ID" --git-sha "${{ github.sha }}" --out "$ART/playwright-summary.json" \
            ${{ needs.plan.outputs.require_tests && format('--require-tests ''{0}''', needs.plan.outputs.require_tests) || '' }}
          pnpm --filter ops-release release-cli browser-audit --report "$ART/browser-audit.json" --out "$ART/browser-findings.json"
      - name: Post-deploy gate (CRITICAL ⇒ rollback)
        id: gate
        if: steps.remote_deploy.outcome == 'success'
        continue-on-error: true
        run: |
          # --require/--identity-bearing: a release may not be verified by evidence that is
          # absent, or that belongs to an earlier run/commit.
          pnpm --filter ops-release release-cli gate --phase post-deploy \
            --findings "$ART/vm-findings.json,$ART/endpoints.json,$ART/csp-client-web.json,$ART/csp-admin-web.json,$ART/browser-findings.json,$ART/playwright-summary.json" \
            --require "$ART/endpoints.json,$ART/playwright-summary.json" \
            --identity-bearing "endpoints.json,playwright-summary.json" \
            --expect-run-id "$RUN_ID" --expect-git-sha "${{ github.sha }}" \
            ${{ inputs.approve_high && '--approve-high' || '' }} \
            --out "$ART/gate.json"
      - name: Automatic rollback (post-deploy CRITICAL)
        if: steps.gate.outcome == 'failure' && steps.gate.outputs.gate_rollback == 'true'
        run: |
          pnpm --filter ops-release release-cli state-transition --file "$ART/state.json" --to FAILED --note "post-deploy verification found CRITICAL findings"
          pnpm --filter ops-release release-cli remote-rollback $REMOTE --out "$ART/rollback.json"
          pnpm --filter ops-release release-cli remote-health $REMOTE
          pnpm --filter ops-release release-cli state-transition --file "$ART/state.json" --to ROLLED_BACK
      - name: Mark failed (blocked without rollback need)
        if: steps.gate.outcome == 'failure' && steps.gate.outputs.gate_rollback != 'true'
        run: pnpm --filter ops-release release-cli state-transition --file "$ART/state.json" --to FAILED --note "post-deploy gate blocked (unapproved HIGH findings)"
      - name: State → BROWSER_VERIFIED
        if: steps.gate.outcome == 'success'
        run: pnpm --filter ops-release release-cli state-transition --file "$ART/state.json" --to BROWSER_VERIFIED
      - name: Record what is now deployed (advance refs/deployed/production)
        # Only after BROWSER_VERIFIED: a deploy that was rolled back by the post-deploy gate must
        # NOT move the ref — production is back on the previous version and the ref still names
        # it. The next release's risk window is measured from this ref (see the plan job), so
        # advancing it on anything less than a verified deploy would re-open the exact
        # tagged-but-undeployed hole this mechanism closes.
        #
        # `+` (force) is correct here and only here: this ref MOVES by design. It is not a tag,
        # so assertTagAvailable's refuse-to-reuse contract does not apply to it.
        #
        # MANUAL ROLLBACK RUNBOOK NOTE: a rollback performed outside this workflow must move this
        # ref back too (git push origin +<old-sha>:refs/deployed/production), or the next release
        # will measure from a version that is no longer running.
        #
        # `gh api`, not `git push`: this job's checkout deliberately sets
        # persist-credentials: false (it handles production SSH keys, and the GITHUB_TOKEN has no
        # business sitting in its .git/config). The API path needs no git credentials, and the
        # POST fallback creates the ref on the very first run, so there is no manual bootstrap.
        if: steps.remote_deploy.outcome == 'success' && steps.gate.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYED_SHA: ${{ needs.plan.outputs.git_sha }}
        run: |
          set -euo pipefail
          if ! gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/deployed/production" \
               -f sha="$DEPLOYED_SHA" -F force=true >/dev/null 2>&1; then
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/deployed/production" -f sha="$DEPLOYED_SHA" >/dev/null
          fi
          echo "refs/deployed/production -> $DEPLOYED_SHA"
      - name: Upload Playwright evidence (on failure)
        if: always() && (steps.gate.outcome == 'failure' || steps.remote_deploy.outcome == 'failure')
        uses: actions/upload-artifact@v6
        # results.json ONLY. Playwright traces/screenshots from a failed admin login capture
        # the real SMOKE_ADMIN_PASSWORD and session cookie, and an uploaded artifact is
        # downloadable by anyone with repository read access.
        with: { name: playwright-evidence, path: podcast-saas/client-web/e2e-results/results.json, if-no-files-found: ignore }
      - uses: actions/upload-artifact@v6
        if: always()
        with: { name: release-artifacts, path: release-artifacts, overwrite: true, include-hidden-files: true }
      - name: Fail the job if deployment or verification failed
        if: steps.remote_deploy.outcome == 'failure' || steps.gate.outcome == 'failure'
        run: exit 1

  # ── 6. BROWSER_VERIFIED → RELEASED ───────────────────────────────────────────────
  publish:
    name: Publish GitHub release
    needs: [plan, deploy]
    # Same trap the deploy job documents above: risk-review is SKIPPED on routine releases, and an
    # `if` with NO status function keeps the implicit "all transitive needs succeeded" precondition
    # — so publish silently skipped on every routine deploy (v0.1.40–43 all sat as drafts while
    # v0.1.39, a pre-rework release, published fine). `!cancelled()` switches the implicit
    # precondition off; the explicit deploy-result check keeps the only gate that matters.
    if: ${{ inputs.deploy && !cancelled() && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.git_sha }}
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: podcast-saas/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: podcast-saas/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --filter ops-release
      - uses: actions/download-artifact@v6
        with: { name: release-artifacts, path: release-artifacts }
      - name: Publish the release (production verified)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit '${{ needs.plan.outputs.next_tag }}' --draft=false
      - name: State → RELEASED
        run: pnpm --filter ops-release release-cli state-transition --file "$ART/state.json" --to RELEASED
      - uses: actions/upload-artifact@v6
        with: { name: release-artifacts, path: release-artifacts, overwrite: true, include-hidden-files: true }

  # ── 7. Always: assemble release-report.{md,json} ─────────────────────────────────
  report:
    name: Release report
    needs: [plan, verify, build-images, release-plan, deploy, publish]
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: podcast-saas/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: podcast-saas/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --filter ops-release
      - uses: actions/download-artifact@v6
        continue-on-error: true
        with: { name: release-artifacts, path: release-artifacts }
      - name: Assemble release-report.{md,json}
        run: |
          STARTED="$(jq -r '.history[0].at // empty' "$ART/state.json" 2>/dev/null || true)"
          pnpm --filter ops-release release-cli report --dir "$ART" \
            --kind release \
            --run-id "$RUN_ID" \
            --version '${{ needs.plan.outputs.next_tag }}' \
            --previous-version '${{ needs.plan.outputs.current_tag }}' \
            --git-sha '${{ needs.plan.outputs.git_sha }}' \
            --bump '${{ inputs.bump }}' --deploy '${{ inputs.deploy }}' \
            --backfill-policy '${{ inputs.backfill_policy }}' \
            --actor '${{ github.actor }}' \
            --workflow-url '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}' \
            ${STARTED:+--started-at "$STARTED"} --ended-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --out-json "$ART/release-report.json" --out-md "$ART/release-report.md"
      - name: Publish summary
        run: cat "$ART/release-report.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        with: { name: release-report, path: "release-artifacts/release-report.*" }
