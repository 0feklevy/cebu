# CI — runs on every PR and push to main.
# Deterministic gate: frozen install → typecheck → non-interactive lint → tests →
# production builds with explicit public URLs → bundle localhost scan (all via the
# existing pnpm release:verify), plus static audits (secrets, migrations, Dockerfiles,
# incident regressions). No AI, no secrets, no production access.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: podcast-saas

jobs:
  # ── Redundancy guard ───────────────────────────────────────────────────────────
  # The same tree used to be verified three times per change: once on the PR, again on
  # the push to main, and a third time inside the release's own `verify` job. The
  # middle one is the only one that can be dropped without weakening anything, and only
  # when it is PROVABLY redundant:
  #
  #   • the push is a merge commit (two parents), and
  #   • its tree is byte-identical to the tree of the PR head it merged, and
  #   • a `pull_request` CI run for that exact PR head concluded success.
  #
  # If main moved between the PR run and the merge, the trees differ and the full gate
  # runs — which is the case that actually needed re-verification. Anything the script
  # cannot prove leaves skip=false, and a guard that errors fails the run rather than
  # waving it through: this job may only ever remove work that is already done.
  guard:
    name: Redundancy guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.decide.outputs.skip }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Decide whether this exact tree was already verified
        id: decide
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          skip=false
          reason='not a redundant push'

          if [ "${GITHUB_EVENT_NAME}" = 'push' ] && [ "${GITHUB_REF}" = 'refs/heads/main' ]; then
            # `rev-list --parents -n 1` prints "<sha> <parent…>": 3 words means a merge.
            if [ "$(git rev-list --parents -n 1 HEAD | wc -w | tr -d ' ')" = '3' ]; then
              head_tree="$(git rev-parse 'HEAD^{tree}')"
              pr_head="$(git rev-parse 'HEAD^2')"
              pr_tree="$(git rev-parse 'HEAD^2^{tree}')"
              if [ "$head_tree" = "$pr_tree" ]; then
                # event==pull_request matters: only a PR run is guaranteed to have run
                # the full gate, since this guard can never short-circuit one.
                # `|| echo 0` makes an API blip fall through to "not proven", which
                # runs the full gate. A guard may only ever remove work it can prove
                # is done — never fail the build because it could not ask.
                passed="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${pr_head}&per_page=100" \
                  --jq '[.workflow_runs[] | select(.name=="CI" and .event=="pull_request" and .conclusion=="success")] | length' \
                  || echo 0)"
                if [ "${passed:-0}" -ge 1 ]; then
                  skip=true
                  reason="tree ${head_tree} already verified by a successful PR CI run on ${pr_head}"
                else
                  reason="no successful pull_request CI run found for ${pr_head}"
                fi
              else
                reason='main moved since the PR was verified — the merged tree is new'
              fi
            else
              reason='not a merge commit (squash/rebase/direct push) — cannot prove redundancy'
            fi
          fi

          echo "skip=${skip}" >> "$GITHUB_OUTPUT"
          echo "${reason}"
          if [ "$skip" = 'true' ]; then
            echo "::notice::Skipping re-verification — ${reason}. The release workflow verifies from scratch before anything ships."
            echo "### Redundancy guard: skipped re-verification" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "${reason}" >> "$GITHUB_STEP_SUMMARY"
          fi

  release-verify:
    name: Release verification gate
    needs: guard
    if: ${{ needs.guard.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: podcast-saas/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: podcast-saas/pnpm-lock.yaml
      - name: release:verify (frozen install → typecheck → lint → tests → prod builds → bundle scan)
        run: pnpm release:verify

  static-audits:
    name: Static audits (secrets, migrations, docker, incident regressions)
    needs: guard
    if: ${{ needs.guard.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0 # full history + tags for the migration base ref
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: podcast-saas/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: podcast-saas/pnpm-lock.yaml
      - name: Install release engine only
        run: pnpm install --frozen-lockfile --filter ops-release
      - name: Secret scan (tracked files only — never reads env/key contents)
        run: pnpm --filter ops-release release-cli secret-scan
      - name: Migration audit vs latest release tag
        run: |
          BASE_TAG="$(git tag -l | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)"
          echo "Migration audit base: ${BASE_TAG:-<none>}"
          pnpm --filter ops-release release-cli migration-audit --base-ref "${BASE_TAG}"
      - name: Dockerfile checks (buildx lint, no build)
        run: |
          docker buildx build --check -f deploy/docker/backend.Dockerfile .
          docker buildx build --check -f deploy/docker/web.Dockerfile --build-arg APP=client-web .
      - name: Incident regression — certbot one-off runs must use an explicit entrypoint
        run: |
          grep -q -- '--entrypoint certbot certbot certonly' deploy/scripts/init-ssl.sh
          if grep -nE 'compose run (--rm )?certbot certonly' deploy/scripts/init-ssl.sh; then
            echo '::error::init-ssl.sh invokes the certbot renewal-loop entrypoint for a one-off run (the v0.1.0 hang).'
            exit 1
          fi
      - name: Incident regression — VM deploy path must never build from source
        run: |
          for forbidden in 'pnpm install' 'next build' 'compose build' 'docker build' 'tsc'; do
            if grep -nF "$forbidden" deploy/scripts/deploy-images.sh; then
              echo "::error::deploy-images.sh contains '$forbidden' — the VM must not compile during releases."
              exit 1
            fi
          done

  # ── Viewer end-to-end ──────────────────────────────────────────────────────────
  # The ONLY suite that drives the real production viewer: the real Next route, the
  # real React components, the real useProjectPlayer, the real pooled iframes and the
  # real generated bridge. It existed, passed locally, and was invoked by nothing — so
  # the viewer's end-to-end behaviour had zero automated coverage while looking, from
  # the outside, like a covered surface (audit test-quality-013).
  #
  # IT RUNS AGAINST AN APP THIS JOB STARTS, ON LOOPBACK — never the deployed site.
  # `playwright.viewer.config.ts` refuses a non-loopback VIEWER_E2E_BASE_URL outright, so
  # this cannot drift into pointing a media-playing, DOM-mutating browser suite at
  # production the way this package's DEFAULT config (https://flowvidco.com) would.
  #
  # ONE JOB PER ENGINE, not one job running three. The suite is `workers: 1` and
  # `fullyParallel: false` by design (a shared sim pool and per-frame sampling make
  # parallel workers meaningless), so three engines in one job serialise into a runtime
  # no sensible job timeout covers. Splitting them keeps the three-engine signal — the
  # sim runtime's riskiest surfaces (rVFC, MessageChannel timing, WebGL context loss)
  # genuinely diverge between engines — while each job stays inside its budget.
  viewer-e2e:
    name: Viewer end-to-end (${{ matrix.engine }}, real app on loopback)
    needs: guard
    if: ${{ needs.guard.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false # one engine's regression must not hide the other two
      matrix:
        engine: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: podcast-saas/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: podcast-saas/pnpm-lock.yaml
      # Full workspace, not --filter client-web: the suite regenerates its sim fixture by
      # running backend-api's gen-sim-fixture.ts, so backend-api's dependencies must exist.
      - name: Install workspace (frozen)
        run: pnpm install --frozen-lockfile
      # shared/sim/* resolves through shared's exports map to its BUILT dist. Without this
      # the spec's `shared/src/csp` import and the fixture generator both fail during
      # COLLECTION — the exact failure playwright.production.config.ts documents.
      - name: Build shared
        run: pnpm --filter shared build
      # The suite synthesises its own HLS + mp4 media with ffmpeg and fails loudly without it.
      - name: Ensure ffmpeg
        run: ffmpeg -version >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y ffmpeg; }
      - name: Install Playwright browser (${{ matrix.engine }})
        run: pnpm --filter client-web exec playwright install --with-deps ${{ matrix.engine }}
      - name: Viewer e2e against a locally started app
        env:
          # The opt-in that lets the config start its own `next dev` on loopback. Without it
          # the config starts nothing — the audited default that protects a developer's
          # .next directory from being clobbered by a second Next server.
          VIEWER_E2E_START_SERVER: '1'
          NEXT_TELEMETRY_DISABLED: '1'
        run: pnpm --filter client-web test:e2e:viewer --project=${{ matrix.engine }}
      # FAIL CLOSED. A Playwright run that collects zero specs exits 0, and a report that was
      # never written is indistinguishable from a clean one unless something insists on
      # reading it — the false green the production audit already had to fix once.
      - name: The suite must have actually run
        run: |
          node -e '
            const fs = require("fs");
            const p = "client-web/e2e-results/viewer-e2e.json";
            if (!fs.existsSync(p)) { console.error("::error::no viewer-e2e report at " + p + " — the suite did not run"); process.exit(1); }
            const r = JSON.parse(fs.readFileSync(p, "utf8"));
            const walk = (s) => [...(s.specs || []), ...((s.suites || []).flatMap(walk))];
            const specs = (r.suites || []).flatMap(walk);
            if (specs.length === 0) { console.error("::error::viewer-e2e collected 0 specs — a green run that proved nothing"); process.exit(1); }
            console.log("viewer-e2e collected " + specs.length + " specs");
          '
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: viewer-e2e-evidence-${{ matrix.engine }}
          path: |
            podcast-saas/client-web/e2e-results/viewer-e2e.json
            podcast-saas/client-web/test-results
          if-no-files-found: ignore
