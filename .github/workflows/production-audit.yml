# Production audit — read-only inspection of the live system, on demand and daily.
# Inspects containers, endpoints, certificates, CSP, browser behaviour, assets, and
# database URL fields WITHOUT changing anything.
#
# RESULT MODEL (the thing this workflow is careful about)
# -------------------------------------------------------
# Every collector reports exactly one status — PASS / FINDING / ERROR / NOT_CONFIGURED —
# and the run ends in exactly one of:
#
#   PASS                    every collector ran; nothing blocking found
#   BLOCKED_BY_FINDINGS     every collector ran; production violates policy
#   BLOCKED_BY_AUDIT_ERROR  a collector could not produce a trustworthy answer
#
# Those are kept apart because they demand opposite responses: page the on-call for the
# first, fix the pipeline for the second. Run 31199562890 conflated them — Playwright died
# during collection, no browser evidence existed, and the run still reported
# "BLOCKED — 1C/0H/0W / AUDIT_FAILED", which reads exactly like a healthy audit that found
# one real defect.
#
# Uses the "production-audit" environment (read-only SSH credentials, no approval gate)
# so the daily schedule never waits on a human.
name: Production audit

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *' # daily, 03:17 UTC (conservative, off-peak)

permissions:
  contents: read

concurrency:
  group: production-audit
  cancel-in-progress: false

env:
  ART: ${{ github.workspace }}/release-artifacts
  RUN_ID: audit-${{ github.run_id }}-${{ github.run_attempt }}
  GIT_SHA: ${{ github.sha }}
  # Absolute, workspace-anchored. `pnpm --filter ops-release` runs the CLI with cwd =
  # ops/release, so a repo-relative path here resolved to ops/release/client-web/… and
  # produced ENOENT. The CLI now also anchors relative paths to the app root, but the
  # workflow states the path unambiguously rather than relying on that repair alone.
  PW_RESULTS: ${{ github.workspace }}/podcast-saas/client-web/e2e-results/results.json

defaults:
  run:
    working-directory: podcast-saas

jobs:
  audit:
    name: Audit production (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production-audit
    env:
      REMOTE: >-
        --host ${{ vars.PRODUCTION_SSH_HOST }} --user ${{ vars.PRODUCTION_SSH_USER }}
        --key ${{ github.workspace }}/.ssh-deploy-key --known-hosts ${{ github.workspace }}/.ssh-known-hosts
        --repo-dir ${{ vars.PRODUCTION_REPO_DIR }}
    steps:
      # persist-credentials: false — this read-only workflow never pushes, so no git
      # credential is written and checkout's post-step credential cleanup has nothing to do.
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Record audit start time (for the report's Started field)
        working-directory: .
        run: echo "AUDIT_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: podcast-saas/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: podcast-saas/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --filter ops-release --filter client-web

      # ── coverage: state up front which surfaces this run can actually test ──────────
      # A verdict that does not declare its own coverage lets "green" be read as "all of
      # production is healthy" when three surfaces were never visited.
      - name: Declare coverage (which production surfaces are configured)
        env:
          SMOKE_BASE_URL: https://flowvidco.com
          SMOKE_PUBLIC_PATH: ${{ vars.SMOKE_PUBLIC_PATH }}
          SMOKE_PLAYLIST_PATH: ${{ vars.SMOKE_PLAYLIST_PATH }}
          SMOKE_ADMIN_URL: https://admin.flowvidco.com
          SMOKE_ADMIN_EMAIL: ${{ secrets.SMOKE_ADMIN_EMAIL }}
          SMOKE_ADMIN_PASSWORD: ${{ secrets.SMOKE_ADMIN_PASSWORD }}
          SMOKE_ADMIN_PREVIEW_PATH: ${{ vars.SMOKE_ADMIN_PREVIEW_PATH }}
        run: |
          mkdir -p "$ART"
          pnpm --filter ops-release release-cli coverage-report --out "$ART/coverage.json"

      # ── collectors ─────────────────────────────────────────────────────────────────
      # Each collector follows the same shape: run it, capture the REAL exit code, then
      # record an explicit status. `|| true` is deliberately absent — suppressing the exit
      # code is fine, but erasing the status is what made a crash look like a pass.
      - name: Public endpoints + live CSP (semantic)
        run: |
          started=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          set +e
          pnpm --filter ops-release release-cli endpoint-audit \
            --run-id "$RUN_ID" --git-sha "$GIT_SHA" --out "$ART/endpoints.json"
          ep=$?
          set -e
          pnpm --filter ops-release release-cli collector-record \
            --name endpoint-audit --command 'release-cli endpoint-audit' \
            --started-at "$started" --ended-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --exit-code "$ep" --artifact "$ART/endpoints.json" \
            --log "$ART/collectors.json" --run-id "$RUN_ID" --git-sha "$GIT_SHA"

          for app in client-web admin-web; do
            started=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            set +e
            pnpm --filter ops-release release-cli csp-audit --app "$app" --out "$ART/csp-$app.json"
            code=$?
            set -e
            pnpm --filter ops-release release-cli collector-record \
              --name "csp-audit:$app" --command "release-cli csp-audit --app $app" \
              --started-at "$started" --ended-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --exit-code "$code" --artifact "$ART/csp-$app.json" \
              --log "$ART/collectors.json" --run-id "$RUN_ID" --git-sha "$GIT_SHA"
          done

      - name: Write SSH credentials (0600, never logged)
        working-directory: .
        run: |
          umask 077
          printf '%s\n' "${{ secrets.PRODUCTION_SSH_KEY }}" > .ssh-deploy-key
          printf '%s\n' "${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}" > .ssh-known-hosts

      # Strict host-key checking, BatchMode and key-only auth are unchanged. The audit now
      # CLASSIFIES a remote failure (DNS / CONNECT_TIMEOUT / HOST_KEY_MISMATCH / AUTH_FAILED
      # / PERMISSION_DENIED / REPO_MISSING / REMOTE_COMMAND_FAILED / INVALID_REMOTE_JSON)
      # instead of printing a bare "FAILED" and discarding the VM's stdout.
      - name: VM snapshot (containers, /health, worker, certs, DB URL audit — read-only)
        run: |
          started=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          set +e
          pnpm --filter ops-release release-cli remote-audit $REMOTE --out "$ART/vm-audit.json"
          ra=$?
          if [ "$ra" -eq 0 ]; then
            pnpm --filter ops-release release-cli vm-audit --file "$ART/vm-audit.json" \
              --policy report-only --out "$ART/vm-findings.json"
            ra=$?
          fi
          set -e
          pnpm --filter ops-release release-cli collector-record \
            --name remote-audit --command 'release-cli remote-audit' \
            --started-at "$started" --ended-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --exit-code "$ra" --artifact "$ART/vm-findings.json" \
            --log "$ART/collectors.json" --run-id "$RUN_ID" --git-sha "$GIT_SHA"

      # ── Playwright preflight ───────────────────────────────────────────────────────
      # Prove every selected spec can be LOADED before paying for browser installation.
      # `--list` performs module resolution and fails exactly the way run 31199562890
      # failed, but in seconds and without downloading a browser.
      - name: Playwright preflight (every audit spec must load)
        working-directory: podcast-saas/client-web
        run: |
          started=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          set +e
          npx playwright test --config=playwright.production.config.ts --list
          pf=$?
          set -e
          pnpm --filter ops-release release-cli collector-record \
            --name playwright-preflight --command 'playwright test --config=playwright.production.config.ts --list' \
            --started-at "$started" --ended-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --exit-code "$pf" \
            --log "$ART/collectors.json" --run-id "$RUN_ID" --git-sha "$GIT_SHA"
          echo "PREFLIGHT_OK=$([ $pf -eq 0 ] && echo yes || echo no)" >> "$GITHUB_ENV"

      - name: Browser audit (Playwright over the live site)
        if: env.PREFLIGHT_OK == 'yes'
        working-directory: podcast-saas/client-web
        env:
          SMOKE_BASE_URL: https://flowvidco.com
          SMOKE_PUBLIC_PATH: ${{ vars.SMOKE_PUBLIC_PATH }}
          SMOKE_PLAYLIST_PATH: ${{ vars.SMOKE_PLAYLIST_PATH }}
          SMOKE_ADMIN_URL: https://admin.flowvidco.com
          SMOKE_ADMIN_EMAIL: ${{ secrets.SMOKE_ADMIN_EMAIL }}
          SMOKE_ADMIN_PASSWORD: ${{ secrets.SMOKE_ADMIN_PASSWORD }}
          SMOKE_ADMIN_PREVIEW_PATH: ${{ vars.SMOKE_ADMIN_PREVIEW_PATH }}
          PLAYWRIGHT_AUDIT_OUT: ${{ env.ART }}/browser-audit.json
        run: |
          started=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          set +e
          npx playwright install --with-deps chromium
          npx playwright test --config=playwright.production.config.ts
          pw=$?
          set -e
          pnpm --filter ops-release release-cli collector-record \
            --name browser-tests --command 'playwright test --config=playwright.production.config.ts' \
            --started-at "$started" --ended-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --exit-code "$pw" --artifact "$PW_RESULTS" \
            --log "$ART/collectors.json" --run-id "$RUN_ID" --git-sha "$GIT_SHA"

      # If the preflight failed the browser step never ran; record that explicitly so the
      # verdict is BLOCKED_BY_AUDIT_ERROR rather than a silently missing collector.
      - name: Record skipped browser audit (preflight failed)
        if: env.PREFLIGHT_OK != 'yes'
        run: |
          pnpm --filter ops-release release-cli collector-record \
            --name browser-tests --command 'playwright test (skipped)' \
            --exit-code 1 --status ERROR \
            --reason 'skipped because the Playwright preflight could not load every audit spec' \
            --artifact "$PW_RESULTS" \
            --log "$ART/collectors.json" --run-id "$RUN_ID" --git-sha "$GIT_SHA"

      - name: Findings + verdict
        id: gate
        run: |
          started=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          set +e
          pnpm --filter ops-release release-cli playwright-summary --report "$PW_RESULTS" \
            --run-id "$RUN_ID" --git-sha "$GIT_SHA" --out "$ART/playwright-summary.json"
          ps=$?
          set -e
          pnpm --filter ops-release release-cli collector-record \
            --name playwright-summary --command 'release-cli playwright-summary' \
            --started-at "$started" --ended-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --exit-code "$ps" --artifact "$ART/playwright-summary.json" \
            --log "$ART/collectors.json" --run-id "$RUN_ID" --git-sha "$GIT_SHA"

          started=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          set +e
          pnpm --filter ops-release release-cli browser-audit --report "$ART/browser-audit.json" --out "$ART/browser-findings.json"
          ba=$?
          set -e
          pnpm --filter ops-release release-cli collector-record \
            --name browser-audit --command 'release-cli browser-audit' \
            --started-at "$started" --ended-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --exit-code "$ba" --artifact "$ART/browser-findings.json" \
            --log "$ART/collectors.json" --run-id "$RUN_ID" --git-sha "$GIT_SHA"

          # --require makes absence a CRITICAL finding instead of silence; --identity-bearing
          # additionally demands that the named artifacts prove they belong to THIS run, so a
          # stale summary that rode in with a re-run cannot satisfy the gate.
          set +e
          pnpm --filter ops-release release-cli gate --phase post-deploy \
            --findings "$ART/vm-findings.json,$ART/endpoints.json,$ART/csp-client-web.json,$ART/csp-admin-web.json,$ART/browser-findings.json,$ART/playwright-summary.json" \
            --require "$ART/endpoints.json,$ART/playwright-summary.json" \
            --identity-bearing "endpoints.json,playwright-summary.json" \
            --expect-run-id "$RUN_ID" --expect-git-sha "$GIT_SHA" \
            --out "$ART/gate.json"
          gate=$?
          set -e
          echo "gate exited $gate"

      - name: Audit verdict (PASS / BLOCKED_BY_FINDINGS / BLOCKED_BY_AUDIT_ERROR)
        id: verdict
        if: always()
        run: |
          set +e
          pnpm --filter ops-release release-cli audit-verdict \
            --log "$ART/collectors.json" --gate "$ART/gate.json" --coverage "$ART/coverage.json" \
            --out "$ART/audit-verdict.json"
          echo "VERDICT_EXIT=$?" >> "$GITHUB_ENV"
          set -e

      - name: Audit report
        if: always()
        run: |
          pnpm --filter ops-release release-cli report --dir "$ART" \
            --kind audit \
            --run-id "$RUN_ID" --actor '${{ github.actor }}' \
            --git-sha "$GIT_SHA" \
            --workflow-url '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}' \
            --started-at "${AUDIT_STARTED_AT}" \
            --ended-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --out-json "$ART/audit-report.json" --out-md "$ART/audit-report.md"
          cat "$ART/audit-report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: production-audit-${{ github.run_id }}
          path: |
            release-artifacts
            podcast-saas/client-web/e2e-results
          if-no-files-found: ignore

      # One explicit terminal state. The two blocking kinds print different messages so the
      # step annotation alone tells an operator which team owns the failure.
      - name: Terminal state
        if: always()
        run: |
          # Default to BLOCKED_BY_AUDIT_ERROR: if the verdict artifact is unreadable we do
          # not know production's state, and "unknown" must never resolve to green.
          verdict=$(jq -r '.verdict' "$ART/audit-verdict.json" 2>/dev/null || echo 'BLOCKED_BY_AUDIT_ERROR')
          [ -n "$verdict" ] && [ "$verdict" != "null" ] || verdict='BLOCKED_BY_AUDIT_ERROR'
          echo "Audit verdict: $verdict"
          case "$verdict" in
            PASS)
              echo "::notice::Production audit PASS — see the report for coverage (surfaces not configured are listed there)." ;;
            BLOCKED_BY_FINDINGS)
              echo "::error::Production audit BLOCKED_BY_FINDINGS — production violates policy. This is a production incident, not a pipeline failure."
              exit 1 ;;
            *)
              echo "::error::Production audit BLOCKED_BY_AUDIT_ERROR — a collector could not produce a trustworthy answer, so production state is UNKNOWN. Fix the auditor before drawing any conclusion about production."
              exit 1 ;;
          esac
