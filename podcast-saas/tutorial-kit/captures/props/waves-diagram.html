<!doctype html>
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;width:1600px;height:900px;background:#0e1420;overflow:hidden;
    font-family:"Avenir Next","Helvetica Neue",Arial,sans-serif}
  .wrap{position:relative;width:100%;height:100%;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:28px}
  h1{color:#eaf2ff;font-size:54px;font-weight:600;letter-spacing:.5px;margin:0}
  .sub{color:#8fa3c0;font-size:26px;margin:0}
  svg{display:block}
  .lbl{fill:#9fd0ff;font-size:24px;font-weight:600}
  .lbl2{fill:#ffb38a;font-size:24px;font-weight:600}
</style></head><body>
<div class="wrap">
  <h1>Standing waves</h1>
  <p class="sub">Two waves, opposite directions — the pattern stands still</p>
  <svg width="1200" height="420" viewBox="0 0 1200 420">
    <line x1="40" y1="210" x2="1160" y2="210" stroke="#2a3a54" stroke-width="2"/>
    <path id="env" d="" stroke="#58a6ff" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path id="env2" d="" stroke="#58a6ff55" stroke-width="5" fill="none" stroke-linecap="round"/>
    <g id="nodes"></g>
  </svg>
</div>
<script>
  // Standing-wave envelope: y = A sin(kx), nodes every half wavelength.
  const A = 150, cycles = 3, W = 1120, x0 = 40;
  function path(sign){
    let d = '';
    for (let i = 0; i <= 560; i++) {
      const x = i / 560 * W;
      const y = sign * A * Math.sin(cycles * 2 * Math.PI * (i / 560));
      d += (i ? 'L' : 'M') + (x0 + x).toFixed(1) + ' ' + (210 - y).toFixed(1) + ' ';
    }
    return d;
  }
  document.getElementById('env').setAttribute('d', path(1));
  document.getElementById('env2').setAttribute('d', path(-1));
  const g = document.getElementById('nodes');
  for (let n = 0; n <= cycles * 2; n++) {
    const x = x0 + n / (cycles * 2) * W;
    const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    c.setAttribute('cx', x); c.setAttribute('cy', 210); c.setAttribute('r', 9);
    c.setAttribute('fill', '#ffb38a');
    g.appendChild(c);
    const isEdge = n === 0 || n === cycles * 2;
    if (n === 2) {
      const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      t.setAttribute('x', x); t.setAttribute('y', 260); t.setAttribute('text-anchor', 'middle');
      t.setAttribute('class', 'lbl2'); t.textContent = 'node';
      g.appendChild(t);
    }
    if (!isEdge && n === 3) {
      const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      t.setAttribute('x', x - 93); t.setAttribute('y', 40); t.setAttribute('text-anchor', 'middle');
      t.setAttribute('class', 'lbl'); t.textContent = 'antinode';
      g.appendChild(t);
    }
  }
</script>
</body></html>
