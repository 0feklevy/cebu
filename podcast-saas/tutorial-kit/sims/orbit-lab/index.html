<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Orbit Lab — launch a planet, feel the pull</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<canvas id="stage"></canvas>
<div id="hud"><b>Drag anywhere</b> to launch a planet — the drag is its velocity.</div>

<!-- Static controls: FlowVid's scanner reads these ids from the initial DOM. -->
<div id="controls">
  <label>Gravity <output id="gravity-out">1.0×</output>
    <input id="gravity" type="range" min="0.3" max="2.5" step="0.05" value="1"></label>
  <label>Time speed <output id="timescale-out">1.0×</output>
    <input id="timescale" type="range" min="0.2" max="3" step="0.05" value="1"></label>
  <div class="row"><span>Force vectors</span><input id="vectors" type="checkbox" checked></div>
  <div class="row"><span>Trails</span><input id="trails" type="checkbox" checked></div>
  <label>Scene
    <select id="preset">
      <option value="star" selected>One star</option>
      <option value="binary">Binary stars</option>
      <option value="empty">Deep space</option>
    </select></label>
  <button id="demo">Launch demo orbits</button>
  <button id="reset">Reset</button>
</div>

<!-- Classic scripts, load order matters: core → render → input → controls → api. -->
<script src="js/core.js"></script>
<script src="js/render.js"></script>
<script src="js/input.js"></script>
<script src="js/controls.js"></script>
<script src="js/api.js"></script>
</body>
</html>
