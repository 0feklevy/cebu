user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # NO QUERY STRING IN THE ACCESS LOG (security-011).
    #
    # `"$request"` is the raw request line — method, FULL URI including the query, and protocol —
    # so a credential passed as `?token=` is written verbatim into a log file that lives in a
    # Docker volume and is read by anyone debugging. The SSE routes genuinely need a query token
    # (EventSource cannot set headers), and the backend now restricts that fallback to exactly two
    # routes; this is the other half, and it is the half that stops the value being RETAINED.
    #
    # `$request_method $uri` reconstructs the useful part of `$request`: `$uri` is the normalised
    # path with the query stripped. Same information for every debugging purpose this log serves —
    # method, path, status, timing — with the secret removed rather than redacted after the fact.
    #
    # `$http_referer` is kept: it is a header we receive, not one we mint, and a token appearing
    # there is a bug at the sending page rather than something this format can prevent.
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'host=$host rt=$request_time urt=$upstream_response_time';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens   off;

    # Safety default for the default_server. The real per-vhost limit is set from
    # MAX_UPLOAD_SIZE inside conf.d/*.conf (which IS rendered by envsubst).
    #
    # The backend reads the SAME MAX_UPLOAD_SIZE and refuses an over-limit streaming upload
    # itself, with a message naming the number — so this limit is a backstop, not the first
    # thing a user meets. Keep the two in step: a proxy limit below the app's is an upload
    # that dies here after transferring, with no explanation the client can render.
    client_max_body_size 2g;
    client_body_timeout  300s;

    # Long-running responses (transcoding kick-off, LLM calls, HLS).
    proxy_connect_timeout 60s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    # gzip for text assets; media is already compressed.
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Docker's embedded DNS. Resolving upstreams per-request means nginx picks up
    # containers that were recreated by a deploy without needing a full restart.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Reusable proxy header set.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    include /etc/nginx/conf.d/*.conf;
}
